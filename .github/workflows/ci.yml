name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # Full history: the contract gate compares with the merge base, and its golden test replays
      # flyingrobots/geordi#212 from its two commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Rust
        run: rustup toolchain install

      - name: Build geordi-ir for wasm32
        run: cargo build -p geordi-ir --target wasm32-unknown-unknown

      # Compares every public contract of this commit with its base: the merge base with the pull
      # request's base branch, or the previous tip on a push. Fails closed. See docs/contract-gate.md.
      - name: Contract gate (public contracts against the merge base)
        env:
          CONTRACT_GATE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: node scripts/contract-gate.mjs --base-ref "$CONTRACT_GATE_BASE_REF"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @flyingrobots/geordi-example-browser-render-everywhere exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Ban nondeterminism in the canonical paths
        run: pnpm check:determinism

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify package names
        run: pnpm test:package-names

      - name: Verify docs
        run: pnpm test:docs

      - name: Verify test placeholders
        run: pnpm test:placeholders

      - name: Verify repo sludge
        run: pnpm test:repo-sludge

      - name: Verify package exports
        run: pnpm test:exports

      - name: Verify bunny render gates
        run: pnpm test:render-everywhere:bunny

      - name: Verify strict text fixture validation gate
        run: pnpm test:render-everywhere:strict-text-generated

      - name: Verify browser render-everywhere and strict text smoke gates
        run: pnpm --filter @flyingrobots/geordi-example-browser-render-everywhere test:browser

      - name: Verify bijou-gpu browser probe harness
        run: pnpm --filter @flyingrobots/geordi-bijou-gpu test:browser

      - name: Install glslangValidator
        run: sudo apt-get update && sudo apt-get install --yes glslang-tools

      - name: Verify bijou-gpu shader drift gate and kernel conformance
        run: pnpm test:bijou-gpu:shaders

      - name: Verify generated GLSL ES 3.00 with glslangValidator
        run: cargo test -p geordi-bijou-shadergen -- --include-ignored

      # Hosted runners usually expose no wgpu adapter: the run then streams a typed
      # capability-refused result (exit 0, hardwareGpuClaim false), never a pass. A software
      # adapter is reported as software-probed and must still match the CPU oracle frame digest.
      - name: Run the native wgpu offscreen proof (typed refusal without an adapter)
        run: pnpm test:bijou-gpu:native

      - name: Verify native strict text smoke gate (geordi fixture)
        run: cargo run -p native-render-everywhere -- --strict-text-smoke fixtures/render-everywhere/strict-text/geordi.strict-text.geordi.json

[package]
name = "geordi-bijou-wgpu-proof"
description = "Bounded offscreen wgpu proof: renders one packed-bijou-cells/1 fixture with the canonical bijou-surface.wgsl, reads the pixels back and writes an endpoint receipt."
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "geordi-bijou-wgpu-proof"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
geordi-bijou-shadergen = { path = "../geordi-bijou-shadergen" }
serde_json = "1.0.150"
pollster = "0.4.0"
# Exact pin: wgpu 29.0.4 compiles shaders with naga 29.0.4, the version geordi-bijou-shadergen
# pins to validate and translate the same bijou-surface.wgsl.
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12", "gles"] }
